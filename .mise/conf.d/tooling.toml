# Generated by install.py; rerun with the complete tool selection.

["tools"]
"python" = "3.15"
"uv" = "latest"
"ruff" = "latest"
"ty" = "latest"
"bun" = "latest"
"node" = "26"
"prettier" = "latest"
"markdownlint-cli2" = "latest"

["vars"]
"python_dir" = "."
"python_files" = "src tests"
"python_version" = "3.15"
"python_executable" = ".venv/bin/python"
"markdown_dir" = "."
"markdown_files" = "'**/*.md'"
"rust_dir" = "src/xerrion_dev_tooling"

["tasks"]

["tasks"."deps:python"]
"description" = "Install Python dependencies from uv.lock, including the dev group"
"dir" = "{{ vars.python_dir }}"
"run" = "uv sync --locked"

["tasks"."check:python"]
"description" = "Check Python lint, formatting, and types"
"depends" = ["lint:python", "typecheck:python"]

["tasks"."lint:python"]
"description" = "Check Python lint and formatting with Ruff"
"dir" = "{{ vars.python_dir }}"
"run" = ["ruff check {{ vars.python_files }}", "ruff format --check {{ vars.python_files }}"]

["tasks"."format:python"]
"description" = "Format Python with Ruff"
"dir" = "{{ vars.python_dir }}"
"run" = "ruff format {{ vars.python_files }}"

["tasks"."fix:python"]
"description" = "Apply safe Ruff lint fixes"
"dir" = "{{ vars.python_dir }}"
"run" = "ruff check --fix {{ vars.python_files }}"

["tasks"."typecheck:python"]
"description" = "Check Python types with ty"
"dir" = "{{ vars.python_dir }}"
"run" = "ty check --python {{ vars.python_executable | quote }} --python-version {{ vars.python_version | quote }} {{ vars.python_files }}"

["tasks"."test:python"]
"description" = "Run pytest quietly with short failure tracebacks"
"dir" = "{{ vars.python_dir }}"
"run" = "uv run pytest -q --tb=short"

["tasks"."check:markdown"]
"description" = "Check Markdown with the locked local markdownlint and Prettier"
"dir" = "{{ vars.markdown_dir }}"
"run" = ["markdownlint-cli2 --ignore-path .gitignore {{ vars.markdown_files }}", "prettier --check --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}"]

["tasks"."format:markdown"]
"description" = "Format Markdown with the locked local Prettier"
"dir" = "{{ vars.markdown_dir }}"
"run" = "prettier --write --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}"

["tasks"."check:rust"]
"description" = "Check Rust formatting and Clippy warnings"
"dir" = "{{ vars.rust_dir }}"
"run" = ["cargo fmt --all -- --check", "cargo clippy --locked --workspace --all-targets -- -D warnings"]

["tasks"."format:rust"]
"description" = "Format the Rust workspace"
"dir" = "{{ vars.rust_dir }}"
"run" = "cargo fmt --all"

["tasks"."test:rust"]
"description" = "Run Rust workspace tests with Cargo.lock"
"dir" = "{{ vars.rust_dir }}"
"run" = "cargo test --locked --workspace"
