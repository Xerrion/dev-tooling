name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag matching installer/Cargo.toml (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version and reject existing tags
        shell: python3 {0}
        run: |
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          manifest = tomllib.loads(Path("installer/Cargo.toml").read_text())
          expected = "v" + manifest["package"]["version"]
          if tag != expected:
              raise SystemExit(f"Release tag must match Cargo.toml: {expected}")
          subprocess.run(["git", "check-ref-format", f"refs/tags/{tag}"], check=True)
          result = subprocess.run([
              "git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"
          ])
          if result.returncode != 1:
              raise SystemExit(f"Tag already exists or could not be checked: {tag}")

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.1.2

      - name: Select the repository Rust toolchain
        working-directory: installer
        run: rustup show active-toolchain

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"

      - name: Run repository checks and tests
        if: runner.os == 'Linux'
        run: |
          mise run check
          mise run test

      - name: Build installer
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: mise run build:installer:release

      - name: Package runtime files
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
        shell: python {0}
        run: |
          import os
          import shutil
          from pathlib import Path

          platform = os.environ["PLATFORM"]
          binary = "installer.exe" if platform == "windows-x64" else "installer"
          source = Path("installer/target") / os.environ["BUILD_TARGET"] / "release" / binary
          package = Path("package")
          package.mkdir()
          shutil.copy2(source, package / binary)
          shutil.copytree("templates", package / "templates")
          Path("dist").mkdir()
          name = f"dist/xerrion-dev-tooling-{os.environ['RELEASE_TAG']}-{platform}"
          archive_format = "zip" if platform == "windows-x64" else "gztar"
          shutil.make_archive(name, archive_format, root_dir=package)

      - name: Test extracted release package
        shell: python {0}
        run: |
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          archive, = Path("dist").iterdir()
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              root = Path(temporary)
              extracted = root / "extracted"
              shutil.unpack_archive(archive.resolve(), extracted)
              binary = extracted / ("installer.exe" if os.name == "nt" else "installer")
              subprocess.run([str(binary), "--list-tools"], cwd=root, check=True)
              project = root / "project"
              project.mkdir()
              command = [str(binary), str(project), "--tools", "markdown"]
              subprocess.run(command, cwd=root, check=True)
              if list(project.iterdir()):
                  raise SystemExit("Preview unexpectedly changed the project")
              subprocess.run(command + ["--apply"], cwd=root, check=True)
              if not (project / ".mise/conf.d/tooling.toml").is_file():
                  raise SystemExit("Packaged installer did not create its tooling config")

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check packages and create checksums
        working-directory: dist
        shell: bash
        run: |
          for platform in linux-x64 macos-x64 macos-arm64 windows-x64; do
            extension=tar.gz
            if [[ "$platform" == windows-x64 ]]; then extension=zip; fi
            test -s "xerrion-dev-tooling-${RELEASE_TAG}-${platform}.${extension}"
          done
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Create release with packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes "${options[@]}"
