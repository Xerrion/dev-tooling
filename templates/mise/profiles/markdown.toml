[tools]
bun = "latest"
node = "24.15.0"

[vars]
markdown_dir = "."
markdown_files = "'**/*.md'"

[tasks."check:markdown"]
description = "Check Markdown with the locked local markdownlint and Prettier"
dir = "{{ vars.markdown_dir }}"
run = [
  "bun run markdownlint --ignore-path .gitignore {{ vars.markdown_files }}",
  "bun run prettier --check --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}",
]

[tasks."format:markdown"]
description = "Format Markdown with the locked local Prettier"
dir = "{{ vars.markdown_dir }}"
run = "bun run prettier --write --ignore-path .gitignore --ignore-path .prettierignore {{ vars.markdown_files }}"
