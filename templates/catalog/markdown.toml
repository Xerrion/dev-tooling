schema_version = 1
title = "Markdown"
profile = "mise/profiles/markdown.toml"
adapter = "generic"
gitignore = "node_modules/\ndist/\nbuild/\ncoverage/\n"

[detection]
files = []
extensions = ["md", "markdown"]

[aggregates]
check = ["check:markdown"]
format = ["format:markdown"]

[[configs]]
source = "markdown/.prettierrc.json"
kind = "prettier"
alternatives = [".prettierrc.json", ".prettierrc", ".prettierrc.yaml", ".prettierrc.yml", ".prettierrc.toml", ".prettierrc.js", ".prettierrc.cjs", ".prettierrc.mjs", "prettier.config.js", "prettier.config.cjs", "prettier.config.mjs", "prettier.config.ts", ".prettierrc.ts"]

[[configs]]
source = "markdown/.prettierignore"
kind = "ignore"
alternatives = []

[[configs]]
source = "markdown/.markdownlint-cli2.jsonc"
kind = "markdownlint-cli2"
alternatives = [".markdownlint-cli2.jsonc", ".markdownlint-cli2.yaml", ".markdownlint-cli2.cjs", ".markdownlint-cli2.mjs", ".markdownlint.jsonc", ".markdownlint.json", ".markdownlint.yaml", ".markdownlint.yml", ".markdownlint.cjs", ".markdownlint.mjs"]

[[guidance]]
task = "check:markdown"
when = "After Markdown edits, run Markdownlint and Prettier checks."

[[guidance]]
task = "format:markdown"
when = "When Markdown formatting needs correction, run Prettier scoped to Markdown, not JavaScript or TypeScript."
